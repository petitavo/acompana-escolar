[project]
name = "acompana-escolar"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "sqlalchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary]==3.2.10",
    "argon2-cffi==25.1.0",
    "pydantic==2.11.7",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "numpy==2.2.6",
    "scikit-learn==1.7.1",
    "xgboost==3.0.5",
    "shap==0.48.0",
    "pandas==2.3.2",
    "pyarrow==21.0.0",
    "google-auth>=2.40,<3",
    "requests>=2.32.5,<3",
]
[tool.pytest.ini_options]
pythonpath = ["services/backend", "."]
testpaths = ["services/backend/tests"]
