#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
runcmd:
  - [systemctl, enable, --now, docker]
  - [install, -d, -m, '0700', -o, azureuser, -g, azureuser, /opt/acompana-escolar]
  - [sh, -c, 'if [ ! -f /swapfile ]; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile none swap sw 0 0" >> /etc/fstab; fi']
