services:
  db:
    image: postgres:16.10-alpine
    profiles: [demo, lab]
    environment:
      POSTGRES_DB: acompana
      POSTGRES_USER: acompana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate environment with scripts/compose.py}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U acompana -d acompana"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    profiles: [demo, lab]
    environment: &backend
      APP_MODE: ${APP_MODE:?}
      DATABASE_URL: postgresql+psycopg://acompana:${POSTGRES_PASSWORD}@db:5432/acompana
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ARTIFACT_DIR: /workspace/.runtime/artifacts
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-7}
      FEATURE_RETENTION_DAYS: ${FEATURE_RETENTION_DAYS:-90}
      EXPORT_TTL_HOURS: ${EXPORT_TTL_HOURS:-24}
    volumes: [runtime:/workspace/.runtime]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    profiles: [demo, lab]
    command: [python, -m, worker.main]
    environment: *backend
    volumes: [runtime:/workspace/.runtime]
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    profiles: [demo, lab]
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8080/]
      interval: 10s
      timeout: 5s
      retries: 10
  proxy:
    image: caddy:2.10.2-alpine
    profiles: [demo, lab]
    environment:
      LAB_HOST: ${LAB_HOST:-localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile.${APP_MODE}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web: {condition: service_healthy}
    networks: [private]
networks:
  private:
    internal: true
volumes:
  database:
  runtime:
  caddy_data:
